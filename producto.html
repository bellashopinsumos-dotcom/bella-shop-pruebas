<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Producto | Bella Shop</title>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #fffafa;
      color: #3f3136;
    }

    /* ENCABEZADO */

    header {
      background: white;
      padding: 16px 5%;
      border-bottom: 1px solid #f1d6df;

      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }

    .logo {
      font-size: 24px;
      font-weight: bold;
      color: #e65385;
    }

    .volver {
      text-decoration: none;
      color: #e65385;
      font-weight: bold;
      font-size: 14px;
    }

    /* CONTENIDO */

    .contenedor {
      max-width: 1100px;
      margin: auto;
      padding: 35px 20px 60px;
    }

    .ruta {
      font-size: 13px;
      color: #8a6a75;
      margin-bottom: 25px;
    }

    .producto-ficha {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 45px;
      align-items: start;
    }

    /* IMAGEN */

    .imagen-principal {
      background: white;
      border-radius: 22px;
      overflow: hidden;
      border: 1px solid #f0d7df;
      box-shadow: 0 8px 25px rgba(90, 45, 60, 0.08);
    }

    .imagen-principal img {
      width: 100%;
      display: block;
    }

    /* INFORMACIÓN */

    .info {
      padding-top: 5px;
    }

    .categoria {
      color: #e65385;
      font-size: 13px;
      font-weight: bold;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    h1 {
      font-size: 34px;
      line-height: 1.2;
      margin-bottom: 12px;
    }

    .precio {
      font-size: 30px;
      font-weight: bold;
      color: #e65385;
      margin-bottom: 7px;
    }

    .precio-unidad {
      color: #80646d;
      margin-bottom: 25px;
      font-size: 14px;
    }

    .separador {
      border: none;
      border-top: 1px solid #ecdde2;
      margin: 25px 0;
    }

    /* REFERENCIAS */

    .titulo-referencias {
      font-size: 19px;
      margin-bottom: 7px;
    }

    .texto-ayuda {
      color: #80646d;
      font-size: 14px;
      margin-bottom: 18px;
      line-height: 1.5;
    }

    .referencia {
      background: white;
      border: 1px solid #efd7df;
      border-radius: 16px;
      padding: 15px;
      margin-bottom: 12px;

      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }

    .nombre-referencia {
      font-weight: bold;
      font-size: 15px;
    }

    .cantidad {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .cantidad button {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 1px solid #e65385;
      background: white;
      color: #e65385;
      font-size: 20px;
      cursor: pointer;
    }

    .cantidad button:hover {
      background: #fff0f5;
    }

    .numero {
      min-width: 24px;
      text-align: center;
      font-weight: bold;
      font-size: 16px;
    }

    /* RESUMEN */

    .resumen {
      margin-top: 25px;
      padding: 20px;
      border-radius: 18px;
      background: #fff0f5;
    }

    .resumen-linea {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 15px;
    }

    .total {
      font-size: 23px;
      font-weight: bold;
      color: #e65385;
      margin-top: 10px;
    }

    .boton-agregar {
      width: 100%;
      margin-top: 18px;
      border: none;
      border-radius: 16px;
      padding: 15px;

      background: #e65385;
      color: white;

      font-size: 15px;
      font-weight: bold;

      cursor: pointer;
    }

    .boton-agregar:hover {
      background: #d84a79;
    }

    .boton-agregar:disabled {
      background: #efb6ca;
      cursor: not-allowed;
    }

    .mensaje {
      display: none;
      margin-top: 15px;
      background: white;
      border: 1px solid #efcad6;
      padding: 14px;
      border-radius: 13px;
      font-size: 14px;
      line-height: 1.5;
    }

    /* CELULAR */

    @media (max-width: 800px) {

      .contenedor {
        padding: 22px 14px 45px;
      }

      .producto-ficha {
        grid-template-columns: 1fr;
        gap: 25px;
      }

      h1 {
        font-size: 28px;
      }

      .precio {
        font-size: 27px;
      }

      .referencia {
        padding: 13px;
      }

    }

  </style>

</head>

<body>

  <header>

    <div class="logo">
      BELLA SHOP
    </div>

    <a
      href="index.html"
      class="volver"
    >
      ← Volver al catálogo
    </a>

  </header>


  <main class="contenedor">

    <div class="ruta" id="ruta">
      Inicio / Producto
    </div>


    <section class="producto-ficha">

      <div class="imagen-principal">

        <img
          id="imagen-producto"
          src=""
          alt=""
        >

      </div>


      <div class="info">

        <div
          class="categoria"
          id="categoria-producto"
        ></div>

        <h1 id="nombre-producto"></h1>

        <div
          class="precio"
          id="precio-producto"
        ></div>

        <div class="precio-unidad">
          Precio por unidad
        </div>


        <hr class="separador">


        <h2 class="titulo-referencias">
          Escoge tus referencias
        </h2>

        <p class="texto-ayuda">
          Puedes seleccionar más de una referencia y elegir
          la cantidad que necesitas de cada una.
        </p>


        <div id="lista-referencias"></div>


        <div class="resumen">

          <div class="resumen-linea">
            <span>Unidades seleccionadas</span>
            <strong id="total-unidades">0</strong>
          </div>

          <div class="resumen-linea total">
            <span>Total</span>
            <span id="total-precio">$0</span>
          </div>


          <button
            class="boton-agregar"
            id="boton-agregar"
            disabled
          >
            🛍️ AGREGAR SELECCIÓN AL PEDIDO
          </button>


          <div
            class="mensaje"
            id="mensaje"
          ></div>

        </div>

      </div>

    </section>

  </main>


  <script src="productos.js"></script>


  <script>

    const parametros =
      new URLSearchParams(window.location.search);

    const idProducto =
      parametros.get("id");


    const producto =
      productos.find(
        item => item.id === idProducto
      );


    if (!producto) {

      document.body.innerHTML = `
        <div style="
          text-align:center;
          padding:80px 20px;
          font-family:Arial;
        ">
          <h2>Producto no encontrado</h2>

          <br>

          <a href="index.html">
            Volver al catálogo
          </a>
        </div>
      `;

    }

    else {

      cargarProducto(producto);

    }


    function formatoPrecio(numero) {

      return new Intl.NumberFormat(
        "es-CO",
        {
          style: "currency",
          currency: "COP",
          maximumFractionDigits: 0
        }
      ).format(numero);

    }


    const cantidades = {};


    function cargarProducto(producto) {

      document.title =
        producto.nombre + " | Bella Shop";


      document.getElementById(
        "nombre-producto"
      ).textContent =
        producto.nombre;


      document.getElementById(
        "precio-producto"
      ).textContent =
        formatoPrecio(producto.precio);


      document.getElementById(
        "categoria-producto"
      ).textContent =
        producto.categoria +
        " · " +
        producto.subcategoria;


      document.getElementById(
        "ruta"
      ).textContent =
        "Inicio / " +
        producto.categoria +
        " / " +
        producto.subcategoria +
        " / " +
        producto.marca;


      const imagen =
        document.getElementById(
          "imagen-producto"
        );

      imagen.src = producto.imagen;
      imagen.alt = producto.nombre;


      const lista =
        document.getElementById(
          "lista-referencias"
        );


      producto.referencias.forEach(
        function(referencia) {

          cantidades[referencia] = 0;


          const fila =
            document.createElement("div");


          fila.className =
            "referencia";


          fila.innerHTML = `

            <div class="nombre-referencia">
              ${referencia}
            </div>


            <div class="cantidad">

              <button
                onclick="cambiarCantidad('${referencia}', -1)"
              >
                −
              </button>


              <span
                class="numero"
                id="cantidad-${crearId(referencia)}"
              >
                0
              </span>


              <button
                onclick="cambiarCantidad('${referencia}', 1)"
              >
                +
              </button>

            </div>

          `;


          lista.appendChild(fila);

        }
      );

    }


    function crearId(texto) {

      return texto
        .toLowerCase()
        .replaceAll(" ", "-");

    }


    function cambiarCantidad(
      referencia,
      cambio
    ) {

      let nuevaCantidad =
        cantidades[referencia] + cambio;


      if (nuevaCantidad < 0) {

        nuevaCantidad = 0;

      }


      cantidades[referencia] =
        nuevaCantidad;


      document.getElementById(
        "cantidad-" + crearId(referencia)
      ).textContent =
        nuevaCantidad;


      actualizarResumen();

    }


    function actualizarResumen() {

      let unidades = 0;


      Object.values(
        cantidades
      ).forEach(
        cantidad => {
          unidades += cantidad;
        }
      );


      const total =
        unidades * producto.precio;


      document.getElementById(
        "total-unidades"
      ).textContent =
        unidades;


      document.getElementById(
        "total-precio"
      ).textContent =
        formatoPrecio(total);


      document.getElementById(
        "boton-agregar"
      ).disabled =
        unidades === 0;

    }


    document.getElementById(
      "boton-agregar"
    ).addEventListener(
      "click",
      function() {

        const seleccion = [];


        Object.entries(
          cantidades
        ).forEach(
          function([referencia, cantidad]) {

            if (cantidad > 0) {

              seleccion.push(
                referencia +
                " x" +
                cantidad
              );

            }

          }
        );


        if (seleccion.length === 0) {

          return;

        }


        const detalle =
          seleccion.join(", ");


        const totalUnidades =
          Object.values(cantidades)
            .reduce(
              (acumulado, cantidad) =>
                acumulado + cantidad,
              0
            );


        const nombrePedido =
          producto.nombre +
          " - " +
          detalle;


        const url =
          "https://bellashopinsumos-dotcom.github.io/bella-shop-carrito/" +
          "?modo=producto" +
          "&nombre=" +
          encodeURIComponent(nombrePedido) +
          "&precio=" +
          producto.precio +
          "&cantidad=" +
          totalUnidades +
          "&tipo=individual";


        window.location.href = url;

      }
    );

  </script>

</body>

</html>
