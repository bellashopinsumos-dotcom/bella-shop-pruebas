name: Corregir botones volver
on:
  push:
    paths:
      - '.github/workflows/tmp-corregir-volver.yml'
permissions:
  contents: write
jobs:
  corregir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Corregir Removedores y Preparadores
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('removedores/removedores.html')
          s=p.read_text(encoding='utf-8')
          old='<a class="btn" href="../index.html">← VOLVER</a>'
          new='<a class="btn" href="../liquidos.html">← VOLVER</a>'
          if old not in s:
              raise SystemExit('No se encontró VOLVER en removedores')
          p.write_text(s.replace(old,new,1),encoding='utf-8')

          p=Path('preparadores/preparadores.html')
          s=p.read_text(encoding='utf-8')
          old='href="../index.html"\n        class="boton-header boton-volver"'
          new='href="../liquidos.html"\n        class="boton-header boton-volver"'
          if old not in s:
              raise SystemExit('No se encontró VOLVER en preparadores')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Eliminar temporal y guardar
        run: |
          rm -f .github/workflows/tmp-corregir-volver.yml
          git config user.name "bellashopinsumos-dotcom"
          git config user.email "bellashopinsumos@gmail.com"
          git add removedores/removedores.html preparadores/preparadores.html .github/workflows/tmp-corregir-volver.yml
          git commit -m "Corregir VOLVER de Removedores y Preparadores a Liquidos"
          git push
