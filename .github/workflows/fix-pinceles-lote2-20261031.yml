name: Agregar segundo lote de Pinceles
"on":
  push:
    paths:
      - '.github/workflows/fix-pinceles-lote2-20261031.yml'
      - 'scripts/update-pinceles-lote2.py'
permissions:
  contents: write
jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar cambios
        run: python scripts/update-pinceles-lote2.py
      - name: Guardar cambios
        run: |
          git config user.name "Bella Shop Web"
          git config user.email "actions@users.noreply.github.com"
          git add pinceles/index.html
          git commit -m "Agregar segundo lote de Pinceles" || exit 0
          git push
