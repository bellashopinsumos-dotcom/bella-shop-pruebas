name: Ordenar Pinceles por stock
"on":
  push:
    paths:
      - '.github/workflows/ordenar-pinceles-stock-20261031.yml'
permissions:
  contents: write
jobs:
  ordenar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar orden automático por stock
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('pinceles/index.html')
          t=p.read_text(encoding='utf-8')
          old="function render(){contenedor.innerHTML='';CATALOGO.forEach(card);carruseles();filtrar()}"
          new="function render(){contenedor.innerHTML='';const ordenado=CATALOGO.map((cfg,i)=>{const p=buscar(cfg.lookupRef||cfg.ref),stock=p?Math.max(0,Number(p.disponible??p.cantidad_pronosticada??0)):0;return{cfg,i,agotado:!!p&&stock<=0}}).sort((a,b)=>Number(a.agotado)-Number(b.agotado)||a.i-b.i).map(x=>x.cfg);ordenado.forEach(card);carruseles();filtrar()}"
          if old not in t:
              raise SystemExit('No se encontró la función render esperada')
          t=t.replace(old,new,1)
          p.write_text(t,encoding='utf-8')
          PY
      - name: Guardar cambio
        run: |
          git config user.name "Bella Shop Web"
          git config user.email "actions@users.noreply.github.com"
          git add pinceles/index.html
          git commit -m "Ordenar pinceles agotados al final" || exit 0
          git pull --rebase origin main
          git push
