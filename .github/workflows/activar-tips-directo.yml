name: Aplicar Tips y Press On directo

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/activar-tips-directo.yml'

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Modificar index por API
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          python - <<'PY'
          import os, json, base64, urllib.request
          repo=os.environ['REPO']; token=os.environ['GH_TOKEN']
          url=f'https://api.github.com/repos/{repo}/contents/index.html?ref=main'
          headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          req=urllib.request.Request(url,headers=headers)
          with urllib.request.urlopen(req) as r: data=json.load(r)
          s=base64.b64decode(data['content']).decode('utf-8')
          viejo='<div class="cat-visual futura"><span>Press On</span></div>'
          nuevo='<a class="cat-visual cat-elegante" href="tips%20y%20press%20on/index.html"><span class="cat-sello">BELLA SHOP</span><span class="cat-onda"></span><span class="cat-perla"></span><span class="cat-destello">✦</span><strong>Tips y Press On</strong><i></i></a>'
          if viejo not in s: raise SystemExit('Tarjeta Press On no encontrada')
          s=s.replace(viejo,nuevo,1)
          viejo2='<span>Pestañas y Cejas</span><span>Decoración</span><span>Press On</span><span>Limas</span>'
          nuevo2='<span>Pestañas y Cejas</span><span>Decoración</span><a href="tips%20y%20press%20on/index.html">Tips y Press On</a><span>Limas</span>'
          if viejo2 not in s: raise SystemExit('Press On del panel no encontrado')
          s=s.replace(viejo2,nuevo2,1)
          payload=json.dumps({'message':'Conectar Tips y Press On desde inicio','content':base64.b64encode(s.encode()).decode(),'sha':data['sha'],'branch':'main'}).encode()
          req=urllib.request.Request(f'https://api.github.com/repos/{repo}/contents/index.html',data=payload,headers={**headers,'Content-Type':'application/json'},method='PUT')
          with urllib.request.urlopen(req) as r: print(r.status)
          PY
