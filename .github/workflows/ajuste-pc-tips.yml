name: Ajuste PC Tips
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ajuste-pc-tips.yml'
permissions:
  contents: write
jobs:
  ajustar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar CSS escritorio
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tips y press on/index.html')
          s=p.read_text(encoding='utf-8')
          css='''\n@media(min-width:981px){\n.grid{grid-template-columns:1fr;max-width:1120px;gap:28px}\n.product-card{grid-template-columns:minmax(430px,1.05fr) minmax(420px,.95fr);min-height:430px;width:100%}\n.product-image{min-height:430px;padding:22px}\n.product-image img{width:100%;height:100%;max-height:390px;object-fit:contain}\n.product-info{padding:34px 38px}\n.product-info h3{font-size:30px}\n.precio{font-size:30px}\n}\n'''
          if css.strip() not in s:
              s=s.replace('</style>',css+'\n</style>',1)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Guardar
        run: |
          git config user.name "Bella Shop Bot"
          git config user.email "actions@users.noreply.github.com"
          git add "tips y press on/index.html"
          git commit -m "Mejorar vista PC Tips y Press On"
          git push
