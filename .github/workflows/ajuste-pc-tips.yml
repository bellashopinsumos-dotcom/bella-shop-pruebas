name: Agregar Tips al catalogo
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ajuste-pc-tips.yml'
permissions:
  contents: write
jobs:
  ajustar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Agregar productos Tips y filtros
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('tips y press on/index.html')
          s=p.read_text(encoding='utf-8')

          # Filtros para Tips: conserva el filtro principal y agrega todas las formas actuales.
          nuevo_filtro='''<div class="filtros subfiltros" id="filtroTips"><button class="filtro activo" data-forma="todos">Todos</button><button class="filtro" data-forma="sonrisa">Tipo sonrisa</button><button class="filtro" data-forma="curvatura-c">Curvatura C</button><button class="filtro" data-forma="coffin">Coffin</button><button class="filtro" data-forma="cuadrada">Cuadradas</button><button class="filtro" data-forma="almendrada">Almendradas</button></div>'''
          if 'id="filtroTips"' in s:
              s=re.sub(r'<div class="filtros subfiltros" id="filtroTips">.*?</div>',nuevo_filtro,s,count=1,flags=re.S)
          else:
              m=re.search(r'(<div class="filtros subfiltros" id="filtroPress">.*?</div>)',s,re.S)
              if not m:
                  raise SystemExit('No se encontro filtroPress')
              s=s[:m.end()]+nuevo_filtro+s[m.end():]

          # Productos Tips. Las referencias son exactamente las indicadas por Bella Shop.
          # Precio y stock se siguen tomando de inventario.json en tiempo real.
          tips='''
{id:'tip-w049',tipo:'tips',forma:'curvatura-c',nombre:'Tips Curvatura C',marca:'HAKU',formato:'550 pcs',descripcion:'Tips x550 piezas con curvatura C.',imagen:'./imagenes/W049.png',refs:['W049'],barcodes:['W049'],nombres:['TIPS SQUARE X550 PCS HAKU']},
{id:'tip-deja056',tipo:'tips',forma:'coffin',nombre:'Tips Coffin',marca:'DEJA',formato:'240 pcs',descripcion:'Tips Coffin x240 piezas.',imagen:'./imagenes/DEJA056.png',refs:['DEJA056'],barcodes:['5551812512526'],nombres:['TIPS COFFIN X 240 DEJA056']},
{id:'tip-hk445',tipo:'tips',forma:'coffin',nombre:'Tips Coffin',marca:'HAKU',formato:'120 pcs',descripcion:'Tips Coffin x120 piezas.',imagen:'./imagenes/HK-445.png',refs:['HK-445'],barcodes:['7702345454458'],nombres:['CANULA COFFI X120 PCS HAKU']},
{id:'tip-b2554',tipo:'tips',forma:'cuadrada',nombre:'Tips Cuadradas',marca:'SEGO',formato:'240 pcs',descripcion:'Tips cuadrados x240 piezas.',imagen:'./imagenes/B25-54.png',refs:['B25-54'],barcodes:['B25-54'],nombres:['UÑAS PRESS ON X240 SQUARE SEGO B25-54']},
{id:'tip-b2557',tipo:'tips',forma:'coffin',nombre:'Soft Gel Tips Coffin',marca:'TIPS',formato:'240 pcs',descripcion:'Soft Gel Tips Coffin x240 piezas.',imagen:'./imagenes/B25-57.png',refs:['B25-57'],barcodes:['B25-57'],nombres:['SOFT GEL TIPS COFFE x240 B25-57']},
{id:'tip-b2541b',tipo:'tips',forma:'cuadrada',nombre:'Tips Cuadradas 15 Size',marca:'TIPS',formato:'300 pcs · 15 size',descripcion:'Tips cuadrados x300 piezas, 15 tamaños.',imagen:'./imagenes/B25-41B.png',refs:['B25-41B'],barcodes:['B25-41B'],nombres:['SOFT GEL TIPS x300 B25-41B']},
{id:'tip-ca3965',tipo:'tips',forma:'cuadrada',nombre:'Tips Extensión Cuadrada',marca:'TIPS EXTENSION',formato:'600 pcs',descripcion:'Tips de extensión cuadrados x600 piezas.',imagen:'./imagenes/CA3965.png',refs:['CA3965'],barcodes:['CA3965'],nombres:['TIPS EXTENSION COFFIN 600 PS']},
{id:'tip-ca3966',tipo:'tips',forma:'cuadrada',nombre:'Tips Extensión Cuadrada',marca:'TIPS EXTENSION',formato:'600 pcs',descripcion:'Tips de extensión cuadrados x600 piezas.',imagen:'./imagenes/CA3966.png',refs:['CA3966'],barcodes:['CA3966'],nombres:['TIPS EXTENSION CURVA C X120']},
{id:'tip-ca3967',tipo:'tips',forma:'almendrada',nombre:'Tips Extensión Almendra',marca:'TIPS EXTENSION',formato:'600 pcs',descripcion:'Tips de extensión almendrados x600 piezas.',imagen:'./imagenes/CA3967.png',refs:['CA3967'],barcodes:['CA3967'],nombres:['TIPS EXTENSION ALMENDRA X 600PS']},
{id:'tip-b2541',tipo:'tips',forma:'almendrada',nombre:'Soft Gel Tips Almendra',marca:'TIPS',formato:'300 pcs',descripcion:'Soft Gel Tips almendrados x300 piezas.',imagen:'./imagenes/B25-41.png',refs:['B25-41'],barcodes:['B25-41'],nombres:['SOFT GEL TIPS x300 B25-41']},
'''
          if "id:'tip-w049'" not in s:
              marker='const PRODUCTOS=['
              if marker not in s:
                  raise SystemExit('No se encontro const PRODUCTOS=[')
              s=s.replace(marker,marker+'\n'+tips,1)

          p.write_text(s,encoding='utf-8')
          PY
      - name: Guardar
        run: |
          git config user.name "Bella Shop Bot"
          git config user.email "actions@users.noreply.github.com"
          git add "tips y press on/index.html"
          git commit -m "Agregar productos Tips y nuevos filtros" || exit 0
          git push
