name: Conectar B25-41B
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/ajuste-pc-tips.yml
permissions:
  contents: write
jobs:
  corregir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Conectar inventario
        shell: bash
        run: |
          echo '' | base64 -d | python
      - name: Guardar
        shell: bash
        run: |
          git config user.name 'Bella Shop Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add 'tips y press on/index.html'
          git commit -m 'Conectar B25-41B a referencia B25-41' || true
          git push
