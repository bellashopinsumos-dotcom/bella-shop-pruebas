name: Agregar tercer lote de Pinceles
"on":
  push:
    paths:
      - '.github/workflows/add-pinceles-lote3-20261031.yml'
permissions:
  contents: write
jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Actualizar página de Pinceles
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('pinceles/index.html')
          t=p.read_text(encoding='utf-8')

          # Filtro Angular
          if 'data-filtro="angular"' not in t:
              t=t.replace('<button class="filtro" data-filtro="pata-de-cabra">PATA DE CABRA</button>', '<button class="filtro" data-filtro="pata-de-cabra">PATA DE CABRA</button><button class="filtro" data-filtro="angular">ANGULAR</button>', 1)

          # Soporte para lookup distinto de la referencia visible y para tarjetas individuales con la misma referencia
          t=t.replace('function card(cfg){const p=buscar(cfg.ref),stock=', 'function card(cfg){const stockRef=cfg.lookupRef||cfg.ref,p=buscar(stockRef),stock=', 1)
          t=t.replace('stock-enCarrito(cfg.ref)', 'stock-enCarrito(stockRef)')
          t=t.replace("enCarrito(cfg.ref)>0?'Disponibles para agregar: '+l:''", "enCarrito(stockRef)>0?'Disponibles para agregar: '+l:''")
          t=t.replace("clave=requiere?`Pincel - ${cfg.ref} - ${elegida.id}`:`Pincel - ${cfg.ref}`", "clave=requiere?`Pincel - ${cfg.ref} - ${elegida.id}`:`Pincel - ${cfg.uid||cfg.ref}`", 1)
          t=t.replace('baseRef:cfg.ref,tonalidad:', 'baseRef:stockRef,tonalidad:', 1)

          nuevos="""
{ref:'HC-13462',nombre:'Lengua de gato',categoria:'lengua-de-gato',tipo:'Lengua de gato',imagenes:['../HC-13462.png']},
{ref:'DN1793',uid:'DN1793-PLANO',nombre:'Pincel plano',categoria:'plano',tipo:'Plano',imagenes:['../DN1793PLANO.png']},
{ref:'DN1793',uid:'DN1793-ACRILICO',nombre:'Pincel acrílico',categoria:'acrilico',tipo:'Acrílico',imagenes:['../DN1793ACRILICO.png']},
{ref:'DN1793',uid:'DN1793-LINER',nombre:'Pincel liner',categoria:'liner',tipo:'Liner',imagenes:['../DN1793LINER.png']},
{ref:'19-003',uid:'19-003-ANGULAR',nombre:'Pincel angular',categoria:'angular',tipo:'Angular',imagenes:['../19-003ANGULAR.png']},
{ref:'19-003',uid:'19-003-LINER',nombre:'Pincel liner',categoria:'liner',tipo:'Liner',imagenes:['../19-003LINER.png']},
{ref:'HC14972',nombre:'Punzón multi puntas',categoria:'punzones',tipo:'Punzones',imagenes:['../HC14972.png']},
{ref:'MI3018',nombre:'Paquete x5 · Punzones, Liner y Plano',categoria:'punzones',categorias:['punzones','liner','plano'],tipo:'Kit de pinceles x5',imagenes:[]},
{ref:'MSP34',uid:'MSP34-ANGULAR',nombre:'Pincel angular',categoria:'angular',tipo:'Angular',imagenes:[]},
{ref:'MSP34',uid:'MSP34-PLANO',nombre:'Pincel plano',categoria:'plano',tipo:'Plano',imagenes:[]},
{ref:'MSP34',uid:'MSP34-LINER',nombre:'Pincel liner',categoria:'liner',tipo:'Liner',imagenes:[]},
{ref:'DN3867',nombre:'Punzones · paquete x5',categoria:'punzones',tipo:'Punzones',imagenes:['../DN3867.png']},
{ref:'2542',lookupRef:'B2542',nombre:'Punzones · paquete x5',categoria:'punzones',tipo:'Punzones',imagenes:['../2542.png']},
{ref:'0492',nombre:'Liner Triple Cero',categoria:'liner',tipo:'Liner',imagenes:['../0492.png']},
"""
          if "uid:'DN1793-PLANO'" not in t:
              marker="{ref:'DEJA123'"
              pos=t.find(marker)
              if pos < 0:
                  raise SystemExit('No se encontró punto de inserción del catálogo')
              t=t[:pos]+nuevos+t[pos:]

          p.write_text(t,encoding='utf-8')
          PY
      - name: Guardar cambios
        run: |
          git config user.name "Bella Shop Web"
          git config user.email "actions@users.noreply.github.com"
          git add pinceles/index.html
          git commit -m "Agregar tercer lote de Pinceles y filtro Angular"
          git push
