name: Actualizar pinceles 264x
on:
  push:
    paths:
      - '.github/workflows/fix-color-filter.yml'
permissions:
  contents: write
jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar cambio
        run: python .github/scripts/add_pinceles_264x.py
      - name: Guardar cambio
        run: |
          git config user.name "Bella Shop Web"
          git config user.email "actions@users.noreply.github.com"
          git add pinceles/index.html
          git commit -m "Agregar pinceles DN26491 2648-1 y 2650-1" || exit 0
          git push
