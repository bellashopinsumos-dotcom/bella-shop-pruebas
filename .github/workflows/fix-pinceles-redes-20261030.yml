name: Ajustar redes de Pinceles
on:
  push:
    paths:
      - '.github/workflows/fix-pinceles-redes-20261030.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar corrección
        run: |
          python - <<'PY'
          import base64,zlib
          exec(zlib.decompress(base64.b64decode(''))).decode('utf-8')
          PY
      - name: Guardar cambios
        run: |
          git config user.name "Bella Shop Web"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/fix-pinceles-redes-20261030.yml
          git add pinceles/index.html
          git commit -m "Unificar redes y simplificar Pinceles"
          git push
