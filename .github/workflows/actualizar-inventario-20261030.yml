name: Actualizar inventario 2026-10-30
on:
  push:
    paths:
      - .github/workflows/actualizar-inventario-20261030.yml
permissions:
  contents: write
jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar inventario actualizado
        shell: bash
        env:
          DELTA: 
        run: |
          python - <<'PY'
          import os,json,gzip,base64
          d=json.loads(gzip.decompress(base64.b64decode(os.environ['DELTA'])))
          p='inventario.json'
          inv=json.load(open(p,encoding='utf-8'))
          inv['fuente']=d['source']
          for k in d['removes']: inv['productos'].pop(k,None)
          inv['productos'].update(d['changes'])
          with open(p,'w',encoding='utf-8') as f: json.dump(inv,f,ensure_ascii=False,indent=2)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add inventario.json
          git commit -m "Actualizar inventario 2026-10-30"
          git push
