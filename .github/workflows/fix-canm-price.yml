name: Ajustar precio CANM

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-canm-price.yml'

permissions:
  contents: write

jobs:
  ajustar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ajustar precio dinámico CANM
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('gel-nail-art/painting-gel.html')
          s = p.read_text(encoding='utf-8')

          viejo = '<div class="compra"><div class="precio">$19.000</div><div class="instruccion"><strong>Elige tu referencia 💕</strong>Escribe el nombre tal como aparece en la imagen.</div>'
          nuevo = '<div class="compra"><div class="precio" id="precioCanm">Desde $19.000<div style="font-size:12px;font-weight:600;color:#806870;margin-top:5px">El precio puede variar según la referencia.</div></div><div class="instruccion"><strong>Elige tu referencia 💕</strong>Escribe el nombre tal como aparece en la imagen.</div>'
          if viejo not in s:
              raise SystemExit('No se encontró el bloque de precio CANM esperado')
          s = s.replace(viejo, nuevo, 1)

          nuevo_script = '''<script>
          (function(){
            var inv={},actual=null,stock=0,q=1,precio=19000,
            refs={"BRILLO DEL SOL":"7709544892937","FLAN DE FRESAS":"CM483","SELVA NEGRA":"7709544892586","SALVA NEGRA":"7709544892586","SENORITA":"7709544893019","ALGODON DE LA INDIA":"CM265","CREAM GEL":"CM379","CREMA DE LECHE":"CM379","LEYENDA DE ORO":"7709544892593"},
            input=document.getElementById("refCanm"),estado=document.getElementById("estadoCanm"),wrap=document.getElementById("cantidadCanm"),cant=document.getElementById("cantCanm"),total=document.getElementById("totalCanm"),precioEl=document.getElementById("precioCanm");

            function norm(x){return String(x||"").normalize("NFD").replace(/[\\u0300-\\u036f]/g,"").trim().toUpperCase()}
            function money(n){return "$"+Number(n).toLocaleString("es-CO")}
            function precioInicial(){precio=19000;precioEl.innerHTML='Desde $19.000<div style="font-size:12px;font-weight:600;color:#806870;margin-top:5px">El precio puede variar según la referencia.</div>'}
            function precioExacto(){precioEl.innerHTML=money(precio)+'<div style="font-size:12px;font-weight:600;color:#806870;margin-top:5px">Precio de esta referencia.</div>'}
            function upd(){cant.value=q;total.textContent=money(q*precio)}
            function msg(t,a,b){estado.className="estado show "+t;estado.innerHTML="<strong>"+a+"</strong><div class='unidades'>"+b+"</div>"}
            function cart(){try{var x=JSON.parse(localStorage.getItem("bellaShopCarrito")||"[]");return Array.isArray(x)?x:[]}catch(e){return[]}}
            function inCart(r){return cart().filter(function(x){return x.clave==="Painting Gel CANM - "+r}).reduce(function(a,x){return a+Number(x.cantidad||0)},0)}

            function consult(){
              actual=null;stock=0;q=1;wrap.classList.remove("show");precioInicial();upd();
              var r=norm(input.value),target=refs[r];
              if(!target){msg("missing","CÓDIGO NO ENCONTRADO","Revisa el nombre de la referencia.");return}
              var p=inv[target]||null;
              if(!p){msg("missing","CÓDIGO NO ENCONTRADO","No encontramos esta referencia en el inventario actualizado.");return}
              precio=Number(p.precio_venta||19000);
              actual={ref:r==="CREAM GEL"?"Crema de Leche":input.value.trim(),item:p};
              stock=Math.max(0,Number(p.disponible||0));
              precioExacto();upd();
              if(!stock){msg("zero","TEMPORALMENTE NO DISPONIBLE","0 unidades disponibles.");return}
              msg("ok","DISPONIBLE",stock+" unidad"+(stock===1?"":"es")+" disponible"+(stock===1?"":"s")+".");
              wrap.classList.add("show");
            }

            document.getElementById("buscarCanm").onclick=consult;
            input.addEventListener("keydown",function(e){if(e.key==="Enter"){e.preventDefault();consult()}});
            document.getElementById("menosCanm").onclick=function(){if(q>1){q--;upd()}};
            document.getElementById("masCanm").onclick=function(){if(actual&&q<stock-inCart(actual.ref)){q++;upd()}};
            document.getElementById("agregarCanm").onclick=function(){
              if(!actual)return;
              var c=cart(),k="Painting Gel CANM - "+actual.ref,ex=c.find(function(x){return x.clave===k});
              if(inCart(actual.ref)+q>stock){msg("zero","CANTIDAD MÁXIMA","No hay más unidades disponibles.");return}
              if(ex){ex.cantidad=Number(ex.cantidad||0)+q;ex.precio=precio;}
              else c.push({clave:k,nombre:"Painting Gel CANM",marca:"CANM",referencia:actual.ref,codigo:String(actual.item.codigo_original_odoo||actual.item.codigo_barras||actual.item.codigo||""),precio:precio,cantidad:q,imagen:"gel-nail-art/imagenes/painting-canm.png"});
              localStorage.setItem("bellaShopCarrito",JSON.stringify(c));
              var t=document.getElementById("toast");t.textContent="Painting Gel CANM agregado a tu pedido 💕";t.classList.add("show");setTimeout(function(){t.classList.remove("show")},2200);consult();
            };
            fetch("../inventario.json?actualizacion="+Date.now(),{cache:"no-store"}).then(function(r){return r.json()}).then(function(d){inv=d.productos||{}}).catch(function(){});
          })();
          </script>'''

          patron = re.compile(r'<script>\s*\(function\(\)\{var PRECIO=19000,inv=\{\}.*?</script>', re.S)
          s, n = patron.subn(nuevo_script, s, count=1)
          if n != 1:
              raise SystemExit(f'No se pudo reemplazar el script CANM: {n}')

          p.write_text(s, encoding='utf-8')
          PY
          rm .github/workflows/fix-canm-price.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gel-nail-art/painting-gel.html .github/workflows/fix-canm-price.yml
          git commit -m "CANM: mostrar precio según referencia"
          git push
