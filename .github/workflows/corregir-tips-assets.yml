name: Corregir imagenes e iconos Tips y Press On
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/corregir-tips-assets.yml'
permissions:
  contents: write
jobs:
  corregir:
    runs-on: ubuntu-latest
    steps:
      - name: Corregir pagina por API
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          python - <<'PY'
          import os, json, base64, urllib.request, re
          repo=os.environ['REPO']; token=os.environ['GH_TOKEN']
          path='tips y press on/index.html'
          enc_path=urllib.parse.quote(path, safe='/')
          headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          url=f'https://api.github.com/repos/{repo}/contents/{enc_path}?ref=main'
          req=urllib.request.Request(url,headers=headers)
          with urllib.request.urlopen(req) as r: data=json.load(r)
          s=base64.b64decode(data['content']).decode('utf-8')

          # Usar rutas absolutas de GitHub Pages + version para evitar cache viejo
          s=s.replace("imagen:'imagenes/", "imagen:'/bella-shop-pruebas/tips%20y%20press%20on/imagenes/")
          s=re.sub(r"(imagen:'/bella-shop-pruebas/tips%20y%20press%20on/imagenes/[^']+\.png)'", r"\1+'?v=20261028'", s)
          # La expresion anterior puede dejar concatenacion JS; normalizar a string unica
          s=re.sub(r"imagen:'(/bella-shop-pruebas/tips%20y%20press%20on/imagenes/[^']+\.png)'\+'\?v=20261028'", r"imagen:'\1?v=20261028'", s)

          # Reemplazar bloque de contacto por iconos estandar Bella Shop
          inicio=s.index('<section class="contacto">')
          fin=s.index('</section>', inicio)+len('</section>')
          contacto='''<section class="contacto"><img class="cara-contacto" src="../imagenes/Cara logo bellashop.png" alt=""><div class="contacto-content"><h2>¿Necesitas una ayudita? 💕</h2><p>Estamos aquí para ti ✨ Escríbenos y con mucho gusto te ayudamos con tu pedido.</p><a class="wa" href="https://wa.me/573122002698?text=%C2%A1Holaaa%2C%20Bella%20Shop%21%20%F0%9F%92%95%E2%9C%A8%20Estuve%20viendo%20su%20cat%C3%A1logo%20y%20encontr%C3%A9%20varias%20cositas%20que%20me%20encantaron%20%F0%9F%A5%B0.%20%C2%BFMe%20ayudan%20por%20favor%20con%20mi%20pedido%3F%20%F0%9F%92%97" target="_blank" rel="noopener noreferrer"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20.5 3.5A11.8 11.8 0 0 0 12.1 0C5.6 0 .3 5.3.3 11.8c0 2.1.6 4.2 1.6 6L0 24l6.4-1.7a11.8 11.8 0 0 0 5.7 1.5h.1c6.5 0 11.8-5.3 11.8-11.8 0-3.2-1.2-6.2-3.5-8.5Zm-8.4 18.3a9.8 9.8 0 0 1-5-1.4l-.4-.2-3.8 1 1-3.7-.2-.4a9.8 9.8 0 1 1 18.2-5.1 9.9 9.9 0 0 1-9.8 9.8Zm5.4-7.4c-.3-.2-1.7-.9-2-.9-.3-.1-.5-.2-.7.2-.2.3-.8.9-.9 1.1-.2.2-.3.2-.6.1-.3-.2-1.3-.5-2.5-1.6-.9-.8-1.5-1.9-1.7-2.2-.2-.3 0-.4.1-.6l.5-.6c.2-.2.2-.4.3-.6.1-.2 0-.4 0-.6-.1-.2-.7-1.7-1-2.3-.2-.6-.5-.5-.7-.5H7c-.3 0-.6.1-.9.4-.3.3-1.2 1.2-1.2 2.9s1.2 3.4 1.4 3.6c.2.2 2.5 3.8 6.1 5.3.9.4 1.5.6 2 .7.9.3 1.7.2 2.3.1.7-.1 1.7-.7 2-1.4.2-.7.2-1.3.2-1.4-.1-.1-.3-.2-.6-.4Z"/></svg>ESCRÍBENOS POR WHATSAPP</a><div class="redes"><a class="red" href="https://www.instagram.com/bellashop_byluisazu?stkn=eWhvYTluMzI2ZDcw" target="_blank" rel="noopener noreferrer" aria-label="Instagram"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg></a><a class="red" href="https://www.facebook.com/share/19W4wkJ3ZL/?mibextid=wwXIfr" target="_blank" rel="noopener noreferrer" aria-label="Facebook"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M13.7 21v-8h2.7l.4-3h-3.1V8.1c0-.9.2-1.5 1.6-1.5H17V4a22 22 0 0 0-2.4-.1c-2.4 0-4.1 1.5-4.1 4.2V10H8v3h2.5v8h3.2Z"/></svg></a><a class="red" href="https://www.tiktok.com/@bellashopbyluisazu?_r=1&_t=ZS-99cxLBT7EKC" target="_blank" rel="noopener noreferrer" aria-label="TikTok"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M15.4 3c.4 2 1.6 3.3 3.6 3.8v6.1a6 6 0 1 1-5.2-6v3.1a3 3 0 1 0 2.2 2.9V3h3Z"/></svg></a></div><a class="ubicacion" href="https://www.google.com/maps/place/Bella+Shop/@2.4420044,-76.6123511,17z/" target="_blank" rel="noopener noreferrer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M20 10c0 5-8 12-8 12S4 15 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2.5"/></svg>Popayán, Cauca</a></div></section>'''
          s=s[:inicio]+contacto+s[fin:]

          payload=json.dumps({'message':'Corregir imagenes e iconos de Tips y Press On','content':base64.b64encode(s.encode()).decode(),'sha':data['sha'],'branch':'main'}).encode()
          req=urllib.request.Request(f'https://api.github.com/repos/{repo}/contents/{enc_path}',data=payload,headers={**headers,'Content-Type':'application/json'},method='PUT')
          with urllib.request.urlopen(req) as r: print(r.status)
          PY
