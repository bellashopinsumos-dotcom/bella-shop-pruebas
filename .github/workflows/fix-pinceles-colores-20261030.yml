name: Corregir Pinceles colores
on:
  push:
    paths:
      - '.github/workflows/fix-pinceles-colores-20261030.yml'
permissions:
  contents: write
jobs:
  corregir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Corregir página de Pinceles
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('pinceles/index.html')
          text = path.read_text(encoding='utf-8')

          old = "{ref:'DN1277',nombre:'Pata de cabra',categoria:'pata-de-cabra',tipo:'Pata de cabra',imagenes:[]},"
          new = "{ref:'DN1277',nombre:'Pata de cabra',categoria:'pata-de-cabra',tipo:'Pata de cabra',imagenes:['imagenes/DN1277.png']},"
          if old not in text:
              raise SystemExit('No se encontró bloque DN1277')
          text = text.replace(old, new, 1)

          anchor = "{ref:'DN4718',nombre:'Pincel acrílico #10',categoria:'acrilico',tipo:'Acrílico',imagenes:['imagenes/DN4718.png']},"
          hk = "{ref:'HK071',nombre:'Pincel acrílico #12',categoria:'acrilico',tipo:'Acrílico',imagenes:['imagenes/HK071.png']},"
          if "ref:'HK071'" not in text:
              if anchor not in text:
                  raise SystemExit('No se encontró ancla para HK071')
              text = text.replace(anchor, anchor + "\n " + hk, 1)

          old123 = """{ref:'DEJA123',nombre:'Liner paquete x5 · 20 mm, 8 mm, 5 mm, 25 mm y 12 mm',categoria:'liner',tipo:'Liner · varios colores',variantes:[
   {id:'T1',nombre:'Tonalidad 1',imagen:'imagenes/DEJA123AM.png'},
   {id:'T2',nombre:'Tonalidad 2',imagen:'imagenes/DEJA123M.png'},
   {id:'T3',nombre:'Tonalidad 3',imagen:'imagenes/DEJA123R.png'}
 ]},"""
          new123 = """{ref:'DEJA123',nombre:'Liner paquete x5 · 20 mm, 8 mm, 5 mm, 25 mm y 12 mm',categoria:'liner',tipo:'Liner · varios colores',variantes:[
   {id:'AM',nombre:'Azul morado',imagen:'imagenes/DEJA123AM.png',swatch:'linear-gradient(135deg,#63b7ff 0%,#6d43c7 100%)'},
   {id:'RM',nombre:'Rosado morado',imagen:'imagenes/DEJA123M.png',swatch:'linear-gradient(135deg,#f59ac3 0%,#9258c9 100%)'},
   {id:'RC',nombre:'Rosado claro',imagen:'imagenes/DEJA123R.png',swatch:'linear-gradient(135deg,#ee9db9 0%,#f7d8e1 100%)'}
 ]},"""
          if old123 not in text:
              raise SystemExit('No se encontró bloque DEJA123')
          text = text.replace(old123, new123, 1)

          old124 = """{ref:'DEJA124',nombre:'Liner paquete x5 · 8 mm, 5 mm, 20 mm, 25 mm y 12 mm',categoria:'liner',tipo:'Liner · varios colores',variantes:[
   {id:'T1',nombre:'Tonalidad 1',imagen:'imagenes/DEJA124.png'},
   {id:'T2',nombre:'Tonalidad 2',imagen:'imagenes/DEJA124A.png'},
   {id:'T3',nombre:'Tonalidad 3',imagen:'imagenes/DEJA124B.png'},
   {id:'T4',nombre:'Tonalidad 4',imagen:'imagenes/DEJA124M.png'},
   {id:'T5',nombre:'Tonalidad 5',imagen:'imagenes/DEJA124P.png'}
 ]}"""
          new124 = """{ref:'DEJA124',nombre:'Liner paquete x5 · 8 mm, 5 mm, 20 mm, 25 mm y 12 mm',categoria:'liner',tipo:'Liner · varios colores',variantes:[
   {id:'N',nombre:'Negro',imagen:'imagenes/DEJA124.png',swatch:'#222226'},
   {id:'A',nombre:'Azul cielo',imagen:'imagenes/DEJA124A.png',swatch:'#8fd9f4'},
   {id:'B',nombre:'Blanco',imagen:'imagenes/DEJA124B.png',swatch:'#ffffff'},
   {id:'M',nombre:'Morado',imagen:'imagenes/DEJA124M.png',swatch:'#956ac2'},
   {id:'P',nombre:'Rosado claro piel',imagen:'imagenes/DEJA124P.png',swatch:'#eac5bb'}
 ]}"""
          if old124 not in text:
              raise SystemExit('No se encontró bloque DEJA124')
          text = text.replace(old124, new124, 1)

          css_new = ".tonalidades{margin:2px 0 16px;padding:13px;border:1px solid #f0d5de;border-radius:16px;background:#fff9fb}.tonalidades-label{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:11px;font-size:10px;font-weight:900;letter-spacing:.55px;color:#9b5870;text-transform:uppercase}.tonalidades-label span:last-child{font-size:9px;font-weight:700;letter-spacing:0;color:#a88793;text-transform:none}.tonos{display:flex;flex-wrap:wrap;gap:11px;align-items:center}.tono-btn{appearance:none;width:36px;height:36px;border-radius:50%;border:2px solid #ead0d9;background:#fff;padding:4px;cursor:pointer;transition:.18s;display:inline-flex;align-items:center;justify-content:center}.tono-btn:hover{transform:scale(1.06);border-color:#d98aa4}.tono-btn.activo{border-color:#e65385;box-shadow:0 0 0 3px rgba(230,83,133,.16);transform:scale(1.07)}.swatch{display:block;width:24px;height:24px;border-radius:50%;border:1px solid rgba(80,50,60,.13);box-shadow:inset 0 1px 2px rgba(255,255,255,.45)}.tono-nombre{margin-top:9px;font-size:10px;font-weight:800;color:#8a6471}.tono-ayuda{font-size:9px;color:#a07d89;margin-top:5px;line-height:1.4}"
          text2, n = re.subn(r"\.tonalidades\{.*?\.tono-ayuda\{.*?\}", css_new, text, count=1, flags=re.S)
          if n != 1:
              raise SystemExit(f'No se pudo reemplazar CSS tonalidades: {n}')
          text = text2

          selector_new = """function selectorTonalidadesHTML(cfg){if(!Array.isArray(cfg.variantes)||cfg.variantes.length<2)return '';return `<div class=\"tonalidades\" data-tonalidades><div class=\"tonalidades-label\"><span>Escoge el color</span><span>Obligatorio</span></div><div class=\"tonos\">${cfg.variantes.map((v,i)=>`<button class=\"tono-btn\" type=\"button\" data-variante=\"${v.id}\" data-index=\"${i}\" title=\"${v.nombre}\" aria-label=\"${v.nombre}\"><span class=\"swatch\" style=\"background:${v.swatch}\"></span></button>`).join('')}</div><div class=\"tono-nombre\" data-tono-nombre>Selecciona un color</div><div class=\"tono-ayuda\">Toca una bolita para escoger el color antes de agregarlo al pedido.</div></div>`}"""
          text2, n = re.subn(r"function selectorTonalidadesHTML\(cfg\)\{.*?\}\nfunction crearCard", selector_new + "\nfunction crearCard", text, count=1, flags=re.S)
          if n != 1:
              raise SystemExit(f'No se pudo reemplazar selector de colores: {n}')
          text = text2

          old_click = "card.querySelectorAll('.tono-btn').forEach(btn=>btn.addEventListener('click',()=>{card.querySelectorAll('.tono-btn').forEach(x=>x.classList.remove('activo'));btn.classList.add('activo');varianteSeleccionada=cfg.variantes.find(v=>v.id===btn.dataset.variante)||null;const carrusel=card.querySelector('[data-carrusel]');if(carrusel&&carrusel._irA)carrusel._irA(Number(btn.dataset.index)||0);actualizarControles()}));"
          new_click = "card.querySelectorAll('.tono-btn').forEach(btn=>btn.addEventListener('click',()=>{card.querySelectorAll('.tono-btn').forEach(x=>x.classList.remove('activo'));btn.classList.add('activo');varianteSeleccionada=cfg.variantes.find(v=>v.id===btn.dataset.variante)||null;const etiqueta=card.querySelector('[data-tono-nombre]');if(etiqueta&&varianteSeleccionada)etiqueta.textContent=varianteSeleccionada.nombre;const carrusel=card.querySelector('[data-carrusel]');if(carrusel&&carrusel._irA)carrusel._irA(Number(btn.dataset.index)||0);actualizarControles()}));"
          if old_click not in text:
              raise SystemExit('No se encontró manejador de selección de color')
          text = text.replace(old_click, new_click, 1)
          text = text.replace('Selecciona una tonalidad para agregar este producto.','Selecciona un color para agregar este producto.')
          text = text.replace('Escoge una tonalidad antes de agregar 💕','Escoge un color antes de agregar 💕')
          path.write_text(text, encoding='utf-8')
          PY
      - name: Guardar corrección y limpiar workflow temporal
        run: |
          git config user.name "Bella Shop Web"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/fix-pinceles-colores-20261030.yml
          git add pinceles/index.html
          git commit -m "Mejorar selector de colores y completar Pinceles"
          git push
# trigger 2
