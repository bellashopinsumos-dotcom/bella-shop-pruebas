name: Corregir inventario Muna fluorescente

on:
  push:
    paths:
      - '.github/workflows/corregir-codigos-no-encontrados.yml'

permissions:
  contents: write

jobs:
  corregir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Agregar referencias faltantes al inventario
        shell: python
        run: |
          import json
          from pathlib import Path
          p = Path('inventario.json')
          datos = json.loads(p.read_text(encoding='utf-8'))
          productos = datos.setdefault('productos', {})
          productos['92102'] = {
            'codigo':'92102','codigo_original_odoo':'92102',
            'nombre':'ESMALTE SEMIPERMANENTE MUNA FLUORESCENTE REF 02',
            'precio_venta':12500,'disponible':5,'a_la_mano':5
          }
          productos['921-07'] = {
            'codigo':'921-07','codigo_original_odoo':'921-07',
            'nombre':'ESMALTE SEMIPERMANENTE MUNA FLUORESCENTE REF 07',
            'precio_venta':12500,'disponible':1,'a_la_mano':1
          }
          productos['92111'] = {
            'codigo':'92111','codigo_original_odoo':'92111',
            'nombre':'ESMALTE SEMIPERMANENTE MUNA FLUORESCENTE REF 11',
            'precio_venta':12500,'disponible':0,'a_la_mano':0
          }
          p.write_text(json.dumps(datos, ensure_ascii=False, separators=(',', ':')), encoding='utf-8')
          for codigo, stock in [('92102',5),('921-07',1),('92111',0)]:
            x=productos[codigo]
            assert x['precio_venta']==12500 and x['disponible']==stock
      - name: Guardar inventario corregido
        run: |
          git config user.name "Bella Shop Bot"
          git config user.email "actions@users.noreply.github.com"
          git add inventario.json
          git diff --cached --quiet && exit 0
          git commit -m "Corregir inventario fluorescente Muna 02 07 11"
          git push
