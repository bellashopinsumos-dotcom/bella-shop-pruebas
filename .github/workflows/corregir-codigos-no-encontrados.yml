name: Corregir electricos definitivo
on:
  push:
    paths:
      - '.github/workflows/corregir-codigos-no-encontrados.yml'
permissions:
  contents: write
jobs:
  corregir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar ajustes
        shell: python
        run: |
          from pathlib import Path
          p=Path('electricos/electricos.html')
          s=p.read_text(encoding='utf-8')

          # Persistencia de categoria al actualizar.
          ini=s.index('document.querySelectorAll(".chip").forEach(b=>b.addEventListener')
          fin=s.index('\nfunction actualizarFiltros()',ini)
          nuevo='''const estadoKey="bellaShopElectricosCategoria";
          try{const g=localStorage.getItem(estadoKey);if(g&&document.querySelector('.chip[data-cat="'+g+'"]'))categoria=g}catch(e){}
          document.querySelectorAll(".chip").forEach(x=>x.classList.toggle("activo",x.dataset.cat===categoria));
          document.querySelectorAll(".chip").forEach(b=>b.addEventListener("click",()=>{document.querySelectorAll(".chip").forEach(x=>x.classList.remove("activo"));b.classList.add("activo");categoria=b.dataset.cat;try{localStorage.setItem(estadoKey,categoria)}catch(e){}actualizarFiltros();filtrar()}));["buscar","precio","watts","rpm","conexion","tipo-lampara"].forEach(id=>document.getElementById(id).addEventListener(id==="buscar"?"input":"change",filtrar));'''
          s=s[:ini]+nuevo+s[fin:]

          # Ajustes visuales robustos: agotados sin compra y tinas sin etiquetas de lampara.
          extra='''
function ajustarTarjetasBella(){
 document.querySelectorAll("#productos .producto").forEach(card=>{
   const estado=card.querySelector(".estado.no");
   if(estado){const controles=card.querySelector(".controles");if(controles)controles.style.display="none";}
   const titulo=(card.querySelector("h3")?.textContent||"").toUpperCase();
   if(titulo.includes("DEJA074")||titulo.includes("DN2925")){
     card.querySelectorAll(".dato").forEach(d=>{if(!d.textContent.toUpperCase().includes("REF."))d.style.display="none";});
   }
 });
}
const productosBella=document.getElementById("productos");
if(productosBella)new MutationObserver(ajustarTarjetasBella).observe(productosBella,{childList:true,subtree:true});
'''
          cierre=s.rfind('</script>')
          assert cierre!=-1
          s=s[:cierre]+extra+s[cierre:]
          p.write_text(s,encoding='utf-8')

          t=p.read_text(encoding='utf-8')
          assert 'bellaShopElectricosCategoria' in t
          assert 'MutationObserver(ajustarTarjetasBella)' in t
          assert 'DEJA074' in t and 'DN2925' in t
      - name: Guardar cambios
        run: |
          git config user.name "Bella Shop Bot"
          git config user.email "actions@users.noreply.github.com"
          git add electricos/electricos.html
          git diff --cached --quiet && exit 0
          git commit -m "Corregir categoria agotados y tinas"
          git push
