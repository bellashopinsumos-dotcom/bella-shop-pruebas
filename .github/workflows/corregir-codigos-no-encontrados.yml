name: Ajustar electricos

on:
  push:
    paths:
      - '.github/workflows/corregir-codigos-no-encontrados.yml'

permissions:
  contents: write

jobs:
  ajustar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ajustar pagina
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('electricos/electricos.html')
          s=p.read_text(encoding='utf-8')

          # Recordar categoria activa al recargar.
          inicio=s.index('document.querySelectorAll(".chip").forEach(b=>b.addEventListener')
          fin=s.index('\nfunction actualizarFiltros()', inicio)
          eventos='''const estadoKey="bellaShopElectricosCategoria";
          try{const guardada=localStorage.getItem(estadoKey);if(guardada&&document.querySelector('.chip[data-cat="'+guardada+'"]'))categoria=guardada}catch(e){}
          document.querySelectorAll(".chip").forEach(x=>x.classList.toggle("activo",x.dataset.cat===categoria));
          document.querySelectorAll(".chip").forEach(b=>b.addEventListener("click",()=>{document.querySelectorAll(".chip").forEach(x=>x.classList.remove("activo"));b.classList.add("activo");categoria=b.dataset.cat;try{localStorage.setItem(estadoKey,categoria)}catch(e){}actualizarFiltros();filtrar()}));["buscar","precio","watts","rpm","conexion","tipo-lampara"].forEach(id=>document.getElementById(id).addEventListener(id==="buscar"?"input":"change",filtrar));'''
          s=s[:inicio]+eventos+s[fin:]

          # Tinas no muestran datos propios de lamparas.
          s=s.replace("x.categoria==='raspacallos'?'':'<span class=\"dato\">⚡ '+x.watts+'W</span><span class=\"dato\">UV/LED</span><span class=\"dato\">🔌 '+(x.conexion==\"inalambrica\"?'INALÁMBRICA':'NO INALÁMBRICA')+'</span>'", "(x.categoria==='raspacallos'||x.categoria==='tinas')?'':'<span class=\"dato\">⚡ '+x.watts+'W</span><span class=\"dato\">UV/LED</span><span class=\"dato\">🔌 '+(x.conexion==\"inalambrica\"?'INALÁMBRICA':'NO INALÁMBRICA')+'</span>'")

          # Ocultar controles de compra cuando no hay stock o no se encuentra codigo.
          patron=r"<div class=\\\"controles\\\"><input class=\\\"qty\\\" id=\\\"qty-'\+x\.codigo\+'\\\" type=\\\"number\\\" min=\\\"1\\\" '\+\(stock>0\?'max=\\\"'\+stock\+'\\\"':' '\?\)"
          # Reemplazo literal sobre el fragmento real, mas seguro por limites conocidos.
          marca="+'<div class=\"estado '+(stock>0?\"ok\":\"no\")+'\">'+estado+'</div>"
          pos=s.index(marca)
          cini=s.index("<div class=\"controles\">",pos)
          cfin=s.index("<div class=\"mini\" id=\"mini-",cini)
          mini_fin=s.index("</div></article>'",cfin)+6
          bloque=s[cini:mini_fin]
          s=s[:cini]+"'+(stock>0?'"+bloque+"':'')+'"+s[mini_fin:]

          p.write_text(s,encoding='utf-8')

          # Verificaciones obligatorias.
          t=p.read_text(encoding='utf-8')
          assert 'bellaShopElectricosCategoria' in t
          assert 'localStorage.setItem(estadoKey,categoria)' in t
          assert "x.categoria==='tinas'" in t
          assert "stock>0?'" in t
      - name: Guardar
        run: |
          git config user.name "Bella Shop Bot"
          git config user.email "actions@users.noreply.github.com"
          git add electricos/electricos.html
          git diff --cached --quiet && exit 0
          git commit -m "Corregir estado agotados y tinas en electricos"
          git push
