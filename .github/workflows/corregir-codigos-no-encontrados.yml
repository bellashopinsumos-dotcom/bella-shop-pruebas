name: Corregir UX electricos

on:
  push:
    paths:
      - '.github/workflows/corregir-codigos-no-encontrados.yml'

permissions:
  contents: write

jobs:
  corregir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Aplicar mejoras de UX
        shell: python
        run: |
          from pathlib import Path
          p=Path('electricos/electricos.html')
          s=p.read_text(encoding='utf-8')

          # 1. Recordar categoria y filtros al recargar.
          old='document.querySelectorAll(".chip").forEach(b=>b.addEventListener("click",()=>{document.querySelectorAll(".chip").forEach(x=>x.classList.remove("activo"));b.classList.add("activo");categoria=b.dataset.cat;actualizarFiltros();filtrar()}));["buscar","precio","watts","rpm","conexion","tipo-lampara"].forEach(id=>document.getElementById(id).addEventListener(id==="buscar"?"input":"change",filtrar));'
          new='''const estadoKey="bellaShopElectricosEstado";
          function guardarEstado(){localStorage.setItem(estadoKey,JSON.stringify({categoria,buscar:document.getElementById("buscar").value,precio:document.getElementById("precio").value,watts:document.getElementById("watts").value,rpm:document.getElementById("rpm").value,conexion:document.getElementById("conexion").value,tipoLampara:document.getElementById("tipo-lampara").value}))}
          function restaurarEstado(){try{const e=JSON.parse(localStorage.getItem(estadoKey)||"{}");if(e.categoria&&document.querySelector('.chip[data-cat="'+e.categoria+'"]'))categoria=e.categoria;document.querySelectorAll(".chip").forEach(x=>x.classList.toggle("activo",x.dataset.cat===categoria));[["buscar",e.buscar],["precio",e.precio],["watts",e.watts],["rpm",e.rpm],["conexion",e.conexion],["tipo-lampara",e.tipoLampara]].forEach(([id,v])=>{const el=document.getElementById(id);if(el&&v!=null&&[...el.options||[]].some(o=>o.value===v)||id==="buscar"&&el&&v!=null)el.value=v})}catch(_){}}
          document.querySelectorAll(".chip").forEach(b=>b.addEventListener("click",()=>{document.querySelectorAll(".chip").forEach(x=>x.classList.remove("activo"));b.classList.add("activo");categoria=b.dataset.cat;actualizarFiltros();guardarEstado();filtrar()}));["buscar","precio","watts","rpm","conexion","tipo-lampara"].forEach(id=>document.getElementById(id).addEventListener(id==="buscar"?"input":"change",()=>{guardarEstado();filtrar()}));'''
          assert old in s, 'No se encontro bloque de eventos'
          s=s.replace(old,new,1)

          # 2. Tinas: solo referencia, sin etiquetas de lampara.
          old2="x.categoria==='raspacallos'?'':'<span class=\"dato\">⚡ '+x.watts+'W</span><span class=\"dato\">UV/LED</span><span class=\"dato\">🔌 '+(x.conexion===\"inalambrica\"?'INALÁMBRICA':'NO INALÁMBRICA')+'</span>')+'<span class=\"dato\">REF. '+(x.referencia||x.codigo)+'</span>"
          new2="(x.categoria==='raspacallos'||x.categoria==='tinas')?'':'<span class=\"dato\">⚡ '+x.watts+'W</span><span class=\"dato\">UV/LED</span><span class=\"dato\">🔌 '+(x.conexion===\"inalambrica\"?'INALÁMBRICA':'NO INALÁMBRICA')+'</span>')+'<span class=\"dato\">REF. '+(x.referencia||x.codigo)+'</span>"
          assert old2 in s, 'No se encontro bloque de etiquetas'
          s=s.replace(old2,new2,1)

          # 3. Sin stock: ocultar cantidad y boton de compra.
          old3="+'<div class=\"estado '+(stock>0?\"ok\":\"no\")+'\">'+estado+'</div><div class=\"controles\"><input class=\"qty\" id=\"qty-'+x.codigo+'\" type=\"number\" min=\"1\" '+(stock>0?'max=\"'+stock+'\"':'')+' value=\"1\"><button class=\"agregar\" onclick=\"agregar(\\\''+x.codigo+'\\\')\">AGREGAR A MI PEDIDO</button></div><div class=\"mini\" id=\"mini-'+x.codigo+'\"></div>'"
          new3="+'<div class=\"estado '+(stock>0?\"ok\":\"no\")+'\">'+estado+'</div>'+(stock>0?'<div class=\"controles\"><input class=\"qty\" id=\"qty-'+x.codigo+'\" type=\"number\" min=\"1\" max=\"'+stock+'\" value=\"1\"><button class=\"agregar\" onclick=\"agregar(\\\''+x.codigo+'\\\')\">AGREGAR A MI PEDIDO</button></div><div class=\"mini\" id=\"mini-'+x.codigo+'\"></div>':'')"
          assert old3 in s, 'No se encontro bloque de compra'
          s=s.replace(old3,new3,1)

          # Restaurar antes del primer render.
          old4='actualizarFiltros();fetch("../inventario.json?actualizacion="+Date.now(),{cache:"no-store"})'
          new4='restaurarEstado();actualizarFiltros();fetch("../inventario.json?actualizacion="+Date.now(),{cache:"no-store"})'
          assert old4 in s, 'No se encontro inicio de inventario'
          s=s.replace(old4,new4,1)

          p.write_text(s,encoding='utf-8')
          assert 'x.categoria===\'tinas\'' in s
          assert 'restaurarEstado();actualizarFiltros();fetch' in s
          assert "stock>0?'<div class=\"controles\"" in s
      - name: Guardar cambios
        run: |
          git config user.name "Bella Shop Bot"
          git config user.email "actions@users.noreply.github.com"
          git add electricos/electricos.html
          git diff --cached --quiet && exit 0
          git commit -m "Mejorar agotados filtros y tinas en electricos"
          git push
