name: Actualizar index Liquidos
on:
  push:
    branches: [tmp-index-liquidos]
permissions:
  contents: write
jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reemplazar categorias
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          preparadores='<a class="cat-visual cat-elegante cat-preparadores" href="preparadores/preparadores.html"><span class="cat-sello">BELLA SHOP</span><span class="cat-onda"></span><span class="cat-perla"></span><span class="cat-destello">✦</span><strong>Preparadores</strong><i></i></a>'
          liquidos='<a class="cat-visual cat-elegante cat-preparadores" href="liquidos.html"><span class="cat-sello">BELLA SHOP</span><span class="cat-onda"></span><span class="cat-perla"></span><span class="cat-destello">✦</span><strong>Líquidos</strong><i></i></a>'
          removedores='<a class="cat-visual cat-elegante cat-removedores" href="removedores/removedores.html"><span class="cat-sello">BELLA SHOP</span><span class="cat-onda"></span><span class="cat-perla"></span><span class="cat-destello">✦</span><strong>Removedores</strong><i></i></a>\n'
          panel_p='<a href="preparadores/preparadores.html">Preparadores</a>'
          panel_l='<a href="liquidos.html">Líquidos</a>'
          panel_r='<a href="removedores/removedores.html">Removedores</a>'
          if preparadores not in s or removedores not in s or panel_p not in s or panel_r not in s:
              raise SystemExit('No se encontraron las categorias esperadas; no se modifica el archivo.')
          s=s.replace(preparadores,liquidos,1)
          s=s.replace(removedores,'',1)
          s=s.replace(panel_p,panel_l,1)
          s=s.replace(panel_r,'',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "Bella Shop Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Index: agrupar preparadores y removedores en Liquidos [skip ci]"
          git push
