<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Líquido Moldeador | Bella Shop</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:Arial,Helvetica,sans-serif;background:#fffdfd;color:#34292d}header{background:rgba(255,253,253,.97);padding:11px 5%;display:flex;align-items:center;justify-content:space-between;gap:14px;border-bottom:1px solid #f2dce4;position:sticky;top:0;z-index:100}.logo img{display:block;width:205px;height:72px;object-fit:contain}.acciones{display:flex;gap:9px}.btn{padding:11px 16px;border-radius:40px;text-decoration:none;font-size:12px;font-weight:800;border:1px solid #efc7d4;color:#d94a79;background:#fff}.pedido{background:#e65385;color:#fff;border-color:#e65385}.hero{text-align:center;padding:62px 20px 50px;background:radial-gradient(circle at 12% 18%,rgba(245,174,198,.22),transparent 25%),linear-gradient(135deg,#fff4f7,#fffdfd 50%,#fbe6ed);border-bottom:1px solid #f3dce4}.tag{display:inline-block;padding:8px 18px;border:1px solid #efcbd7;background:#fff;color:#d74e7b;border-radius:40px;font-size:11px;font-weight:800;margin-bottom:17px}.hero h1{font-family:Georgia,"Times New Roman",serif;font-size:48px;font-weight:500;margin-bottom:12px}.hero p{color:#765d65;line-height:1.7}.contenido{padding:55px 5%;background:linear-gradient(180deg,#fffdfd,#fff7f9 50%,#fffdfd)}.grid{max-width:980px;margin:auto;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px}.card{padding:24px 18px;background:#fff;border:1px solid #efd4dd;border-radius:24px;box-shadow:0 12px 32px rgba(91,52,65,.08);text-align:center}.card h3{font-family:Georgia,"Times New Roman",serif;font-size:25px;font-weight:500;margin-bottom:7px}.precio{color:#e65385;font-weight:800;margin-bottom:12px}.producto-img{display:block;width:100%;height:360px;object-fit:contain;background:#fff8fa;border:1px solid #f2dce4;border-radius:22px;margin:12px auto 16px}.detalle{font-size:13px;color:#765d65;margin-bottom:10px}.estado{min-height:30px;font-size:14px;font-weight:800}.ok{color:#2c8a55}.no{color:#c54a63}.cantidad{max-width:430px;margin:14px auto 0;display:grid;grid-template-columns:92px 1fr;gap:10px;padding:7px;background:linear-gradient(135deg,#fff7fa,#fff);border:1px solid #efd4dd;border-radius:22px;box-shadow:0 8px 22px rgba(91,52,65,.08)}.cantidad input{width:100%;height:48px;padding:0 8px;border:1px solid #e9bdcb;border-radius:16px;background:#fff;color:#4d3940;font-size:16px;font-weight:800;text-align:center;outline:none}.agregar{min-height:48px;border:0;border-radius:16px;padding:12px 18px;background:linear-gradient(135deg,#e65385,#d94a79);color:#fff;font-size:11px;font-weight:900;cursor:pointer;box-shadow:0 7px 16px rgba(230,83,133,.22)}.cantidad.bloqueada{opacity:.72;box-shadow:none}.cantidad.bloqueada input{pointer-events:none;background:#faf7f8;color:#a38f96}.cantidad.bloqueada .agregar{background:#bdb3b6;box-shadow:none;cursor:not-allowed}.mini{min-height:18px;margin-top:8px;font-size:12px;font-weight:800;color:#d94d7a}.volver{text-align:center;margin-top:34px}footer{background:#35272c;color:#f9eaf0;text-align:center;padding:28px 20px;font-size:12px}@media(max-width:700px){header{padding:9px 12px}.logo img{width:145px;height:56px}.acciones .btn:not(.pedido){display:none}.hero h1{font-size:38px}.contenido{padding:42px 14px}.grid{grid-template-columns:1fr}.producto-img{height:auto}.cantidad{grid-template-columns:82px 1fr;padding:6px}.cantidad input,.agregar{height:46px;min-height:46px}}
</style>
</head><body>
<header><a class="logo" href="index.html"><img src="imagenes/Logo Bellashop png.png" alt="Bella Shop"></a><div class="acciones"><a class="btn" href="liquidos.html">← VOLVER</a><a class="btn" href="index.html">INICIO</a><a class="btn pedido" href="carrito.html">🛍️ MI PEDIDO</a></div></header>
<section class="hero"><span class="tag">LÍQUIDOS · POLYGEL</span><h1>Líquido moldeador</h1><p>Líquidos para trabajar y moldear polygel de forma cómoda.</p></section>
<main class="contenido"><div class="grid" id="productos"></div><div class="volver"><a class="btn" href="liquidos.html">← VOLVER A LÍQUIDOS</a></div></main>
<footer>Bella Shop · Popayán, Cauca</footer>
<script>
const productos=[
 {nombre:"Moldeador Polygel Utopick",ref:"7702322000708",codigo:"7702322000708",ml:"60 ML",img:"polygel/imagenes/7702322000708.png"},
 {nombre:"Poly Smooth CANM",ref:"7709544894207",codigo:"7709544894207",ml:"130 ML",img:"polygel/imagenes/7709544894207.png"},
 {nombre:"Moldeador Polygel Cloe",ref:"MOLDEADOR60",codigo:"MOLDEADOR60",ml:"60 ML",img:"polygel/imagenes/MOLDEADOR60.png"}
];
let inventario={};
const money=n=>new Intl.NumberFormat("es-CO",{style:"currency",currency:"COP",maximumFractionDigits:0}).format(Number(n)||0);
function itemCodigo(codigo){const v=String(codigo||"").trim().toUpperCase();return Object.values(inventario).find(x=>String(x.codigo||"").trim().toUpperCase()===v||String(x.referencia_interna||"").trim().toUpperCase()===v||String(x.codigo_barras||"").trim().toUpperCase()===v)}
function tarjeta(p,i){return `<article class="card"><h3>${p.nombre}</h3><div class="precio" id="precio-${i}">Precio según inventario</div><img class="producto-img" src="${p.img}" alt="${p.nombre}"><div class="detalle"><b>REF. ${p.ref}</b> · ${p.ml}</div><div class="estado" id="estado-${i}"></div><div class="cantidad bloqueada" id="cant-${i}" data-estado="cargando" data-max="0"><input type="number" min="1" value="1" inputmode="numeric" pattern="[0-9]*" onfocus="this.select()" id="qty-${i}"><button class="agregar" onclick="agregarProducto(${i})">AGREGAR A MI PEDIDO</button></div><div class="mini" id="notif-${i}"></div></article>`}
document.getElementById("productos").innerHTML=productos.map(tarjeta).join("");
function estadoCantidad(i,estado,max){const q=document.getElementById("cant-"+i);q.dataset.estado=estado;q.dataset.max=max||0;q.classList.toggle("bloqueada",estado!=="ok")}
function cargar(i){const p=productos[i],it=itemCodigo(p.codigo),e=document.getElementById("estado-"+i),pr=document.getElementById("precio-"+i);if(!it){e.className="estado no";e.textContent="CÓDIGO NO ENCONTRADO";estadoCantidad(i,"codigo",0);return}pr.textContent=p.ml+" · "+money(it.precio_venta);if(Number(it.disponible)<=0){e.className="estado no";e.textContent="TEMPORALMENTE NO DISPONIBLE";estadoCantidad(i,"agotado",0);return}e.className="estado ok";e.textContent="DISPONIBLE · "+it.disponible+" unidades";estadoCantidad(i,"ok",Number(it.disponible))}
fetch("inventario.json?actualizacion="+Date.now(),{cache:"no-store"}).then(r=>r.json()).then(d=>{inventario=d.productos||d;productos.forEach((_,i)=>cargar(i))}).catch(()=>{productos.forEach((_,i)=>{const e=document.getElementById("estado-"+i);e.className="estado no";e.textContent="INVENTARIO NO DISPONIBLE"})});
function normalizarCantidad(input){const c=input.closest(".cantidad"),max=Number(c?.dataset.max||0);let v=String(input.value||"").trim();if(v===""){input.value=1;return}let n=parseInt(v,10);if(!Number.isFinite(n)||n<1)n=1;if(max>0&&n>max)n=max;input.value=n}
document.addEventListener("focusout",e=>{if(e.target&&e.target.matches('.cantidad input[type="number"]'))normalizarCantidad(e.target)});
function notificar(i,m){const n=document.getElementById("notif-"+i);n.textContent=m;setTimeout(()=>{n.textContent=""},1800)}
function agregarProducto(i){const p=productos[i],q=document.getElementById("cant-"+i);if(q.dataset.estado!=="ok"){notificar(i,q.dataset.estado==="codigo"?"CÓDIGO NO ENCONTRADO":"PRODUCTO TEMPORALMENTE NO DISPONIBLE");return}const it=itemCodigo(p.codigo);if(!it||Number(it.disponible)<=0)return;const input=document.getElementById("qty-"+i);normalizarCantidad(input);const qty=Math.min(Number(input.value)||1,Number(it.disponible));let carrito=[];try{carrito=JSON.parse(localStorage.getItem("bellaShopCarrito"))||[]}catch(e){}const codigo=String(it.codigo||p.codigo);const existente=carrito.find(x=>String(x.codigo||x.ref||"")===codigo);if(existente)existente.cantidad=Math.min((Number(existente.cantidad)||0)+qty,Number(it.disponible));else carrito.push({nombre:p.nombre+" "+p.ml,ref:p.ref,codigo:codigo,precio:Number(it.precio_venta),imagen:p.img,cantidad:qty});localStorage.setItem("bellaShopCarrito",JSON.stringify(carrito));notificar(i,"✓ AGREGADO A MI PEDIDO")}
</script></body></html>
